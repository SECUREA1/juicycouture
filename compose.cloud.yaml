# Supply the managed cloud proxy CA to the dependency installation step only.
services:
  web:
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/proxy_ca
    secrets:
      - proxy_ca
    build:
      secrets:
        - proxy_ca
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:?CODEX_PROXY_CERT must point to the cloud proxy CA}
