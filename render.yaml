services:
  - type: web
    name: juicy-couture-coin-live
    runtime: node
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: COIN_NAME
        value: Juicy Couture Coin
      - key: COIN_SYMBOL
        value: JCQ
      - key: COIN_NETWORK
        value: Solana
      - key: MAX_ROOM_PARTICIPANTS
        value: 8
