services:
  - type: web
    name: juicy-couture-coin-live
    runtime: node
    # Persistent community posts require a paid disk-capable service plan.
    plan: starter
    disk:
      name: community-media
      mountPath: /var/data
      sizeGB: 2
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: COIN_NAME
        value: Juicy Couture Coin
      - key: COIN_SYMBOL
        value: JCQ
      - key: COIN_NETWORK
        value: Solana
      - key: MAX_ROOM_PARTICIPANTS
        value: 8
      - key: TOKEN_MINT
        value: ""
      - key: STREAM_WALLET_ADDRESS
        sync: false
      - key: SOLANA_CLUSTER
        value: mainnet-beta
      - key: MEDIA_DATA_DIR
        value: /var/data/community
      - key: JUPITER_API_KEY
        sync: false
      - key: REWARD_HOST_WALLETS
        sync: false
